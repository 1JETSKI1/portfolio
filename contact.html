<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Contact | Mik de Looij</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html" class="logo">Mik de Looij</a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="products.html">Products</a></li>

          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="contact">
        <div class="contact-content">
          <h2>Lets work together</h2>
          <p>Have a project in mind? Let's work together!</p>
          <form
            action="https://formspree.io/f/xljenvan"
            method="POST"
            class="contact-form"
          >
            <input type="text" name="name" placeholder="Your Name" required />
            <input
              type="email"
              name="email"
              placeholder="Your Email"
              required
            />
            <textarea
              name="message"
              placeholder="Your Message"
              required
            ></textarea>
            <button type="submit" class="btn">Send Message</button>
          </form>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-content">
        <div class="footer-brand">
          <a href="index.html" class="logo">Mik de Looij</a>
          <p>&copy; 2026 Mik de Looij. All rights reserved.</p>
        </div>
        <div class="footer-contact">
          <h4>Contact</h4>
          <a href="mailto:info@mikdelooij.com">info@mikdelooij.com</a>
          <a href="https://wa.me/316XXXXXXXX" target="_blank"
            >+31 6 XXX XXXXX (WhatsApp)</a
          >
        </div>
        <div class="footer-menu">
          <h4>Menu</h4>
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
          <a href="portfolio.html">Portfolio</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </div>
      </div>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
